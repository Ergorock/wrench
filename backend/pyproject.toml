[project]
name = "wrench"
version = "0.1.0"
description = "Wrench, boîte à outils de bureau pour Windows"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=5.3",
    "pydantic>=2.9",
    "send2trash>=2.2.0",
    "segno>=1.6.6",
    "python-barcode>=0.16.1",
    "requests>=2.34.2",
    "playwright>=1.65.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
    "pillow>=11",
    "types-send2trash>=2.1.0.20260408",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = ["barcode", "barcode.*", "segno"]
ignore_missing_imports = true
