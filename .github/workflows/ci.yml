name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend
        working-directory: backend
        run: |
          uv sync
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
